<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - PlayZone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/animations.css">
  <style>
    .history-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-glass);
    }
    .history-table th, .history-table td {
      padding: 1rem 1.5rem;
      text-align: left;
    }
    .history-table th {
      background: rgba(15, 23, 42, 0.5);
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-glass);
    }
    .history-table tr {
      border-bottom: 1px solid var(--border-glass);
    }
    .history-table tr:last-child {
      border-bottom: none;
    }
    .history-table tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .res-win { color: var(--accent-success); font-weight: 700; }
    .res-loss { color: var(--accent-danger); font-weight: 700; }
    .res-reward { color: var(--accent-primary); font-weight: 700; }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    
    @media (max-width: 768px) {
      .history-table th, .history-table td {
        padding: 0.75rem 0.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <aside class="sidebar">
      <div class="logo">PLAYZONE</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="games.html" class="nav-item"><i class="fas fa-gamepad"></i> Games</a>
        <a href="sports.html" class="nav-item"><i class="fas fa-futbol"></i> Sports Simulator</a>
        <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
        <a href="rewards.html" class="nav-item"><i class="fas fa-gift"></i> Rewards</a>
        <a href="history.html" class="nav-item active"><i class="fas fa-history"></i> History</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <div class="logo-mobile">PLAYZONE</div>
        <div class="wallet-display">
          <i class="fas fa-coins"></i>
          <span class="wallet-balance">0</span>
        </div>
      </div>
      
      <div class="history-container">
        <h2 class="section-title"><i class="fas fa-history" style="color: var(--accent-primary);"></i> Transaction History</h2>
        
        <div class="glass-panel" style="padding: 0; overflow-x: auto;">
          <table class="history-table" id="history-table">
            <thead>
              <tr>
                <th>Game / Action</th>
                <th>Result</th>
                <th>Amount</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <!-- Populated by JS -->
            </tbody>
          </table>
          <div id="empty-history" class="empty-state" style="display: none;">
            <i class="fas fa-folder-open"></i>
            <h3>No history yet</h3>
            <p>Play some games to see your history here.</p>
            <a href="games.html" class="btn btn-primary" style="margin-top: 1rem;">Play Now</a>
          </div>
        </div>
      </div>
      
    </main>
    
    <nav class="mobile-nav">
      <a href="index.html" class="mobile-nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="games.html" class="mobile-nav-item">
        <i class="fas fa-gamepad"></i>
        <span>Games</span>
      </a>
      <a href="rewards.html" class="mobile-nav-item">
        <i class="fas fa-gift"></i>
        <span>Rewards</span>
      </a>
      <a href="leaderboard.html" class="mobile-nav-item">
        <i class="fas fa-trophy"></i>
        <span>Leaders</span>
      </a>
      <a href="profile.html" class="mobile-nav-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
    
  </div>

    <script src="./js/storage.js"></script>
  <script src="./js/wallet.js"></script>
  <script src="./js/games.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/history.js"></script>
</body>
</html>
