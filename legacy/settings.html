<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - PlayZone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/animations.css">
  <style>
    .settings-container {
      max-width: 600px;
      margin: 0 auto;
    }
    .setting-group {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .setting-group h3 {
      margin-bottom: 1.5rem;
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-glass);
    }
    .setting-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg-darker);
      transition: .4s;
      border-radius: 34px;
      border: 1px solid var(--border-glass);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--accent-primary);
    }
    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: white;
    }
    
    .danger-zone {
      border-color: rgba(239, 68, 68, 0.3);
    }
    .danger-zone h3 {
      color: var(--accent-danger);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <aside class="sidebar">
      <div class="logo">PLAYZONE</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="games.html" class="nav-item"><i class="fas fa-gamepad"></i> Games</a>
        <a href="sports.html" class="nav-item"><i class="fas fa-futbol"></i> Sports Simulator</a>
        <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
        <a href="rewards.html" class="nav-item"><i class="fas fa-gift"></i> Rewards</a>
        <a href="history.html" class="nav-item"><i class="fas fa-history"></i> History</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item active"><i class="fas fa-cog"></i> Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <div class="logo-mobile">PLAYZONE</div>
        <div class="wallet-display">
          <i class="fas fa-coins"></i>
          <span class="wallet-balance">0</span>
        </div>
      </div>
      
      <div class="settings-container">
        <h2 class="section-title">Settings</h2>
        
        <div class="setting-group animate-fade-in">
          <h3><i class="fas fa-sliders-h"></i> Preferences</h3>
          
          <div class="setting-item">
            <div>
              <div style="font-weight: 600;">Sound Effects</div>
              <div class="text-muted" style="font-size: 0.85rem;">Enable game sound effects</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="sound-toggle">
              <span class="slider"></span>
            </label>
          </div>
          
        </div>
        
        <div class="setting-group danger-zone animate-fade-in" style="animation-delay: 0.1s;">
          <h3><i class="fas fa-exclamation-triangle"></i> Danger Zone</h3>
          
          <div class="setting-item">
            <div>
              <div style="font-weight: 600; color: var(--accent-danger);">Reset All Data</div>
              <div class="text-muted" style="font-size: 0.85rem;">Permanently delete your profile, coins, and history.</div>
            </div>
            <button id="reset-btn" class="btn btn-danger"><i class="fas fa-trash"></i> Reset Data</button>
          </div>
        </div>
        
      </div>
      
    </main>
    
    <nav class="mobile-nav">
      <!-- Standard nav items, hiding some for space if needed, or keeping standard 5 -->
      <a href="index.html" class="mobile-nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="games.html" class="mobile-nav-item">
        <i class="fas fa-gamepad"></i>
        <span>Games</span>
      </a>
      <a href="rewards.html" class="mobile-nav-item">
        <i class="fas fa-gift"></i>
        <span>Rewards</span>
      </a>
      <a href="leaderboard.html" class="mobile-nav-item">
        <i class="fas fa-trophy"></i>
        <span>Leaders</span>
      </a>
      <a href="profile.html" class="mobile-nav-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
    
  </div>

  <script type="module">
    import { Storage } from './js/storage.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      const soundToggle = document.getElementById('sound-toggle');
      const resetBtn = document.getElementById('reset-btn');
      
      // Load current sound pref
      const soundEnabled = Storage.get('soundEnabled');
      soundToggle.checked = soundEnabled === null ? true : soundEnabled;
      
      soundToggle.addEventListener('change', (e) => {
        Storage.set('soundEnabled', e.target.checked);
        window.Toast.show(e.target.checked ? 'Sound enabled' : 'Sound disabled', 'success');
      });
      
      resetBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to completely reset all your data? This action cannot be undone.')) {
          Storage.clear();
          window.Toast.show('Data reset successfully. Reloading...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        }
      });
    });
  </script>
  <script src="./js/storage.js"></script>
  <script src="./js/wallet.js"></script>
  <script src="./js/games.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
