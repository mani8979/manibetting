<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - PlayZone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/animations.css">
  <style>
    .leaderboard-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .leader-row {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      transition: transform 0.3s ease;
    }
    .leader-row:hover {
      transform: translateX(10px);
      border-color: var(--accent-primary);
    }
    .leader-row.current-user {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent-primary);
    }
    .leader-rank {
      font-size: 1.5rem;
      font-weight: 800;
      width: 50px;
      color: var(--text-muted);
    }
    .rank-1 { color: #fbbf24; } /* Gold */
    .rank-2 { color: #94a3b8; } /* Silver */
    .rank-3 { color: #b45309; } /* Bronze */
    
    .leader-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--bg-darker);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-right: 1.5rem;
      color: var(--accent-primary);
    }
    .leader-info {
      flex: 1;
    }
    .leader-name {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .leader-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .leader-coins {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <aside class="sidebar">
      <div class="logo">PLAYZONE</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="games.html" class="nav-item"><i class="fas fa-gamepad"></i> Games</a>
        <a href="sports.html" class="nav-item"><i class="fas fa-futbol"></i> Sports Simulator</a>
        <a href="leaderboard.html" class="nav-item active"><i class="fas fa-trophy"></i> Leaderboard</a>
        <a href="rewards.html" class="nav-item"><i class="fas fa-gift"></i> Rewards</a>
        <a href="history.html" class="nav-item"><i class="fas fa-history"></i> History</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <div class="logo-mobile">PLAYZONE</div>
        <div class="wallet-display">
          <i class="fas fa-coins"></i>
          <span class="wallet-balance">0</span>
        </div>
      </div>
      
      <div class="leaderboard-container">
        <h2 class="section-title"><i class="fas fa-trophy" style="color: #fbbf24;"></i> Top Players</h2>
        <div class="leaderboard-list" id="leaderboard-list">
          <!-- Populated by JS -->
        </div>
      </div>
      
    </main>
    
    <nav class="mobile-nav">
      <a href="index.html" class="mobile-nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="games.html" class="mobile-nav-item">
        <i class="fas fa-gamepad"></i>
        <span>Games</span>
      </a>
      <a href="rewards.html" class="mobile-nav-item">
        <i class="fas fa-gift"></i>
        <span>Rewards</span>
      </a>
      <a href="leaderboard.html" class="mobile-nav-item active">
        <i class="fas fa-trophy"></i>
        <span>Leaders</span>
      </a>
      <a href="profile.html" class="mobile-nav-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
    
  </div>

    <script src="./js/storage.js"></script>
  <script src="./js/wallet.js"></script>
  <script src="./js/games.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/leaderboard.js"></script>
</body>
</html>
