<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewards - PlayZone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/animations.css">
  <style>
    .rewards-container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .streak-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .streak-header i {
      font-size: 4rem;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }
    
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .day-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 1.5rem 1rem;
      text-align: center;
      transition: all 0.3s ease;
      opacity: 0.7;
    }
    
    .day-card.active {
      opacity: 1;
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-glow);
      transform: translateY(-5px);
    }
    
    .day-card.claimed {
      opacity: 0.5;
      border-color: var(--accent-success);
    }
    
    .day-card .day-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    
    .day-card .reward-amount {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-gold);
    }
    
    .day-card i {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <aside class="sidebar">
      <div class="logo">PLAYZONE</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="games.html" class="nav-item"><i class="fas fa-gamepad"></i> Games</a>
        <a href="sports.html" class="nav-item"><i class="fas fa-futbol"></i> Sports Simulator</a>
        <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
        <a href="rewards.html" class="nav-item active"><i class="fas fa-gift"></i> Rewards</a>
        <a href="history.html" class="nav-item"><i class="fas fa-history"></i> History</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <div class="logo-mobile">PLAYZONE</div>
        <div class="wallet-display">
          <i class="fas fa-coins"></i>
          <span class="wallet-balance">0</span>
        </div>
      </div>
      
      <div class="rewards-container">
        <div class="glass-panel animate-fade-in">
          <div class="streak-header">
            <i class="fas fa-calendar-check"></i>
            <h2>Daily Rewards</h2>
            <p class="text-muted">Come back every day to claim increasing rewards!</p>
          </div>
          
          <div class="days-grid" id="rewards-grid">
            <!-- Populated by JS -->
          </div>
          
          <div style="text-align: center;">
            <button id="claim-btn" class="btn btn-primary" style="padding: 1rem 3rem; font-size: 1.2rem;" disabled>Claim Reward</button>
          </div>
        </div>
      </div>
      
    </main>
    
    <nav class="mobile-nav">
      <a href="index.html" class="mobile-nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="games.html" class="mobile-nav-item">
        <i class="fas fa-gamepad"></i>
        <span>Games</span>
      </a>
      <a href="rewards.html" class="mobile-nav-item active">
        <i class="fas fa-gift"></i>
        <span>Rewards</span>
      </a>
      <a href="leaderboard.html" class="mobile-nav-item">
        <i class="fas fa-trophy"></i>
        <span>Leaders</span>
      </a>
      <a href="profile.html" class="mobile-nav-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
    
  </div>

    <script src="./js/storage.js"></script>
  <script src="./js/wallet.js"></script>
  <script src="./js/games.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/rewards.js"></script>
</body>
</html>
